<svg xmlns="http://www.w3.org/2000/svg">
  <!-- PLACEHOLDER monogram of the fictional École Exemple: text only, no emblem. Replace with the school's own crest and keep the three symbol ids. -->
  <symbol id="crest" viewBox="0 0 40 48">
    <rect x="2" y="2" width="36" height="44" rx="6" fill="#13294B"/>
    <rect x="5.5" y="5.5" width="29" height="37" rx="3.5" fill="none" stroke="#C9A13B" stroke-width="1.25"/>
    <text x="20" y="31" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#FBF8F1">EE</text>
  </symbol>
  <!-- Variant for navy backgrounds: gold outline so the edge stays visible. -->
  <symbol id="crest-on-dark" viewBox="0 0 40 48">
    <rect x="2" y="2" width="36" height="44" rx="6" fill="#13294B" stroke="#C9A13B" stroke-width="1.5"/>
    <text x="20" y="31" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#FBF8F1">EE</text>
  </symbol>
  <!-- Round marker of the history timeline. -->
  <symbol id="star-marker" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="10" fill="#F1EBDD"/>
    <circle cx="10" cy="10" r="3.5" fill="#C9A13B"/>
  </symbol>
</svg>
