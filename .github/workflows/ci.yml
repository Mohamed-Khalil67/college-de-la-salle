name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firebase emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build (prerenders the content pages)
        run: npm run build

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Security rules tests (Firestore emulator)
        run: npm run test:rules

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop and mobile, Auth + Firestore emulators)
        run: npm run test:e2e

      - name: Keep the Playwright report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
