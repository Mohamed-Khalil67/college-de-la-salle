version: 2
updates:
  # npm workspaces (apps/api, apps/web, packages/shared): one lockfile at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Angular 22 needs TypeScript >=6.0 <6.1.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node 22 is the runtime (Dockerfiles).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Base images (tag + digest) of the two application images.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /deploy/backup
    schedule:
      interval: weekly
    ignore:
      # Stay on Node 22 and PostgreSQL 18 (majors are a planned change, docs/deployment.md).
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  # Images of the production stack (postgres, cloudflared, caddy).
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
