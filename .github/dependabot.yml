version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      firebase:
        patterns: ['firebase', 'firebase-tools', '@firebase/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
