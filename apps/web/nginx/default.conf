# Web container: static Angular build + reverse proxy of /api to the api service.

# The proxies in front (cloudflared, Caddy) sit on the private Docker network and put the visitor's
# address in X-Forwarded-For; trust it from there only, so the API sees the real client for rate limits.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The calendar feed address IS the credential (/api/calendar/feed/<token>.ics): never write it to the access log.
map $request_uri $loggable {
  ~^/api/calendar/feed/ 0;
  default 1;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
           application/xml image/svg+xml font/ttf application/manifest+json;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  access_log /dev/stdout combined if=$loggable;
  client_max_body_size 12m; # roster imports (CSV)

  # Container healthcheck only.
  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # API: same origin as the site, so the refresh cookie (path /api/auth, SameSite=Strict) just works.
  location /api/ {
    # Resolved per request (Docker's DNS), so recreating the api container needs no nginx restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_hide_header X-Powered-By;
    # Never cache API answers in a browser or an intermediate cache.
    add_header Cache-Control "no-store" always;
    # No security-headers include here: the API sets its own (helmet).
  }

  # Fingerprinted build output: cache for a year.
  location ~* ^/(?:[^/]+\.(?:js|css)|fonts/.+)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Images and icons: not fingerprinted, a day is enough.
  location ~* \.(?:png|jpe?g|webp|avif|svg|ico|txt)$ {
    try_files $uri =404;
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Prerendered public pages (/, /histoire/index.html…) then the client-rendered shell for every other
  # route (/connexion, /eleve, /admin…). HTML is revalidated so a new deploy shows at once.
  location / {
    try_files $uri $uri/index.html /index.csr.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
