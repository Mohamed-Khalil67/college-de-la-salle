# Included in every location that adds headers (nginx drops inherited add_header lines otherwise).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Only meaningful over HTTPS (browsers ignore it on plain HTTP); the tunnel and Caddy both serve HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
