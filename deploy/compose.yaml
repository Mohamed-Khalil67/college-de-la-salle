# School platform production stack (one install per school: SCHOOL in deploy/.env picks the school pack).
# Run from the repository root:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env --profile tunnel up -d --build
# Profiles pick how visitors reach the site (see docs/deployment.md):
#   tunnel  Cloudflare Tunnel: no open router port, works behind CGNAT (recommended for a home laptop)
#   caddy   Caddy + Let's Encrypt for a DOMAIN, for a server with a public IP and ports 80/443 open
# Without a profile only db, api, web and backup run; the site answers on http://127.0.0.1:${WEB_PORT}.
name: cdls

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every service gets no-new-privileges. cap_drop ALL only where the image runs as a non-root user (api, web):
# the postgres, caddy and cloudflared images start as root and need their default capabilities.
x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:18.7@sha256:e754b839f447639b7004895f4d8a4bfcb4e9dbe3a1bc035f27f646562a16fd61
    restart: unless-stopped
    environment:
      POSTGRES_USER: cdls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/scripts/generate-env first}
      POSTGRES_DB: cdls
    # Sized for ~600 students: a few dozen connections, modest memory. Never published on the host.
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "max_connections=60", "-c", "work_mem=8MB", "-c", "log_min_duration_statement=1000"]
    volumes:
      # PostgreSQL 18 images keep the data in a versioned sub-folder of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdls -d cdls"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 768m
    logging: *logging
    <<: *no-new-privileges
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: cdls-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://cdls:${POSTGRES_PASSWORD}@db:5432/cdls?schema=public
      CORS_ORIGIN: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in deploy/.env}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?run deploy/scripts/generate-env first}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?run deploy/scripts/generate-env first}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      THROTTLE_TTL_MS: ${THROTTLE_TTL_MS:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-5}
      REFRESH_THROTTLE_LIMIT: ${REFRESH_THROTTLE_LIMIT:-10}
      REFRESH_IP_THROTTLE_LIMIT: ${REFRESH_IP_THROTTLE_LIMIT:-1200}
      CONTACT_THROTTLE_LIMIT: ${CONTACT_THROTTLE_LIMIT:-5}
      TEMP_PASSWORD_TTL_DAYS: ${TEMP_PASSWORD_TTL_DAYS:-14}
      CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-365}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One proxy (the web container) sits in front of the API; it forwards the real visitor address.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SCHOOL_EMAIL_DOMAIN: ${SCHOOL_EMAIL_DOMAIN:?set SCHOOL_EMAIL_DOMAIN in deploy/.env}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      # The school pack of this install (schools/<SCHOOL>/profile.json): names in mails and report cards, time zone.
      # Must be the same value as the web image's build arg below.
      SCHOOL: ${SCHOOL:-cdls-daher}
      # Empty: "<school name> <no-reply@SCHOOL_EMAIL_DOMAIN>".
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    logging: *logging
    <<: *hardening
    networks: [internal]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
        # The school pack the public pages are prerendered for (schools/<SCHOOL>/): chosen at BUILD time.
        SCHOOL: ${SCHOOL:-cdls-daher}
    image: cdls-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Loopback only: for the local check and the Caddy/tunnel containers use the internal network.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    mem_limit: 128m
    logging: *logging
    <<: *hardening
    networks: [internal]

  backup:
    # Built from deploy/backup/Dockerfile: the postgres client tools of the db service plus age (encrypted dumps).
    build:
      context: ./backup
    image: cdls-backup:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: cdls
      PGDATABASE: cdls
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # age public key (age1...): when set every dump is encrypted to *.dump.age. The private key stays off this machine.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      # Dumps land in this host folder (default deploy/backups). Copy it off the machine regularly.
      - ${BACKUP_DIR:-./backups}:/backups
    mem_limit: 128m
    logging: *logging
    <<: *no-new-privileges
    networks: [internal]

  # --- profile: tunnel ---------------------------------------------------------------------------
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.11.1@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d
    restart: unless-stopped
    # The public hostname of the tunnel (Cloudflare dashboard) must point at http://web:8080.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    <<: *no-new-privileges
    networks: [internal]

  # --- profile: caddy ----------------------------------------------------------------------------
  caddy:
    profiles: [caddy]
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging
    <<: *no-new-privileges
    networks: [internal]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
